# Reverse proxy for SkyClear: compression, request limits, security headers, and no buffering for the live event stream.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
upstream skyclear { server app:8000; keepalive 32; }
server {
  listen 80;
  client_max_body_size 12m;
  gzip on; gzip_types application/json application/javascript text/css text/html image/svg+xml; gzip_min_length 1000;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /events {                       # server-sent events: keep the connection open and send at once
    proxy_pass http://skyclear; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_buffering off; proxy_cache off; proxy_read_timeout 1h;
  }
  location /metrics { allow 127.0.0.1; allow 172.16.0.0/12; deny all; proxy_pass http://skyclear; }  # not public
  location / {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://skyclear; proxy_http_version 1.1; proxy_set_header Connection "";
    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
