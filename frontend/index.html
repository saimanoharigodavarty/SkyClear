<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyClear, pilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" id="top"></header>
<div id="banner" class="banner hidden"><span id="bannerText"></span><button id="bannerBtn" type="button">View alerts</button></div>
<main class="app">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend">
      <div><i style="border-color:#b3261e"></i>Airport, defence</div>
      <div><i style="border-color:#a15c00"></i>Park, government</div>
      <div><i style="border-color:#1f4e79;border-style:dashed"></i>Official notice</div>
    </div>
  </div>
  <aside class="side">
    <nav class="tabs">
      <button data-tab="check" class="on" type="button">Check</button>
      <button data-tab="sim" type="button">Simulate</button>
      <button data-tab="flights" type="button">My flights</button>
      <button data-tab="alerts" type="button">Alerts<span id="alertCount" class="count hidden">0</span></button>
    </nav>

    <section class="pane" id="shared">
      <label for="drone">Drone</label>
      <select id="drone"></select>
      <label for="when">Date and time</label>
      <input id="when" type="datetime-local">
    </section>

    <section class="pane" id="tab-check" style="padding-top:0">
      <div class="hint" id="picked">Click the map to choose where you want to fly.</div>
      <button id="go" type="button" disabled>Check this spot</button>
      <div id="result" class="section"></div>
      <div id="actions"></div>
    </section>

    <section class="pane hidden" id="tab-sim" style="padding-top:0">
      <div class="hint" id="wpHint">Click the map to add waypoints, at least 2.</div>
      <div class="row2">
        <div><label for="speed">Drone speed (m/s)</label><input id="speed" type="number" min="1" max="30" value="10"></div>
        <div><label for="playback">Playback</label><select id="playback"><option value="10">10x</option><option value="30" selected>30x</option><option value="100">100x</option></select></div>
      </div>
      <div class="btnrow"><button id="run" type="button" disabled>Run simulation</button><button id="clearRoute" class="ghost" type="button">Clear</button></div>
      <div id="live" class="live hidden"></div>
      <div id="simResult" class="section"></div>
    </section>

    <section class="pane hidden" id="tab-flights">
      <div id="flightsGate"></div>
      <div id="flightsBody" class="hidden">
        <div class="section" style="margin-top:0"><h3>My drones</h3><div id="myDrones"></div>
          <form id="droneForm">
            <div class="row2">
              <div><label for="dName">Name</label><input id="dName" required maxlength="60" placeholder="DJI Mavic 3"></div>
              <div><label for="dWeight">Weight (g)</label><input id="dWeight" type="number" min="1" required placeholder="895"></div>
            </div>
            <label for="dUin">Registration number (optional)</label><input id="dUin" maxlength="40" placeholder="Self-declared, not verified">
            <button type="submit" class="ghost">Add drone</button>
          </form>
        </div>
        <div class="section"><h3>My flights</h3><div id="flightList"></div></div>
      </div>
    </section>

    <section class="pane hidden" id="tab-alerts">
      <div id="alertsGate"></div>
      <div id="alertsBody" class="hidden">
        <button id="markRead" class="ghost inline" type="button">Mark all as read</button>
        <div id="alertList" class="section"></div>
      </div>
    </section>
  </aside>
</main>
<footer class="foot"><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a>Decision support only, not legal permission. Zones and rules are sample or derived data until verified.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="pilot.js"></script>
</body>
</html>
